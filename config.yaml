# What to watch on https://www.intern-list.com/ and what counts as worth an email.
#
# lists: the site's short names (the ?k= value in its URLs). US lists only.
#   cs   = Cybersecurity            swe = Software Engineering
#   eng  = Engineering and Development   aiml = Machine Learning and AI
#   da   = Data Analysis            pm  = Product Management
#   (run `python -m jobscanner --show-lists` to see them all)
# Jobs come from jobright.ai, which powers the site's job tables.
# Optional per list: title_include (keep only titles containing any of these)
# and title_exclude (drop titles containing any of these). Case-insensitive.

lists:
  - key: cs
  - key: swe
    title_include: [network engineer, networking, network security, network software, network infrastructure, noc]
  - key: eng
    title_include: [network engineer, networking, network security, network infrastructure, noc]
    title_exclude: [electrical, transmission, distribution, power, utility]
  # A community GitHub list of brand-name internships (any key name; `repo` makes it a
  # GitHub list). No pay or company size there, so these qualify by location or priority company.
  # Bump the repo name each season, e.g. Summer2028-Internships.
  - key: github
    repo: SimplifyJobs/Summer2027-Internships
    title_include: [security, cyber, network, infosec, threat, vulnerability, identity, soc analyst, incident response, penetration, red team]
    title_exclude: [physical security, social security]

# Check top companies' own career sites too: jobs appear there before aggregators copy
# them. Sites only say which day a job went up, so the first check of a new site just
# records what's there; after that you get each new job. Every site uses these filters.
company_sites:
  title_require: [intern, co-op]
  title_include: [security, cyber, network, infosec, threat, vulnerability, identity, soc analyst, incident response, penetration, red team, firewall]
  title_exclude: [physical security, social security]
  sites:
    - {company: NVIDIA, workday: "https://nvidia.wd5.myworkdayjobs.com/NVIDIAExternalCareerSite"}
    - {company: CrowdStrike, workday: "https://crowdstrike.wd5.myworkdayjobs.com/crowdstrikecareers"}
    - {company: Cloudflare, greenhouse: cloudflare}
    - {company: Okta, greenhouse: okta}
    - {company: Zscaler, greenhouse: zscaler}

# Skip jobs you can't take. These apply before the criteria below.
eligibility:
  # graduation: 2028-05   # your graduation (YYYY-MM): skips roles for other grad classes
  skip_phd_only: true

# Only consider jobs posted within this many hours. Each email still only contains jobs
# not emailed before, and each run also looks back past the previous run, so this only
# limits the very first run.
max_age_hours: 2

# How often your scheduler (cron-job.org) runs the check, in minutes. Only used for the
# email wording ("Check back in 30 minutes"); the schedule itself lives in cron-job.org.
check_every_minutes: 30

# Send a short "Hi, nothing has been posted!" email after this many hours without any
# email. Remove the line to turn it off.
empty_email_every_hours: 5

# Don't check during these hours, Eastern time: [start, end). Checking resumes at `end`,
# and that run catches up on anything posted while paused.
quiet_hours: [0, 4]

# any = one criterion below is enough; all = every criterion must hold.
match: any

criteria:
  min_hourly_pay: 35            # top of posted range; yearly pay / 2080
  # State codes (CT), metro areas (Bay Area, Los Angeles, San Diego, Seattle, NYC, Boston,
  # Chicago, Austin, DC — suburbs included, see METROS in jobscanner/filters.py) or cities ("Denver, CO").
  locations: [Bay Area, Los Angeles, San Diego, Seattle, NYC, Boston, Chicago, Austin, DC, CT]
  large_company_min_size: 10000 # employees, from the site's size buckets
  priority_companies:           # ranked first; also count as "large company"
    - Palo Alto Networks
    - CrowdStrike
    - Fortinet
    - Zscaler
    - Cisco
    - Okta
    - Cloudflare
    - SentinelOne
    - Apple
    - NVIDIA
    - Meta
    - Google
    - Microsoft
    - Amazon
