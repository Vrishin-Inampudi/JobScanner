name: Internship alerts

on:
  schedule:
    - cron: "23 * * * *"  # hourly; off the top of the hour, when GitHub often delays or skips runs
  workflow_dispatch:
    inputs:
      test:
        description: "Send a [Test] email of matches from the last 24h (doesn't change what's been seen)"
        type: boolean
        default: false

permissions:
  contents: write         # to save seen postings to the `state` branch

concurrency:
  group: internship-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Load seen postings
        # Kept on its own `state` branch as a single commit, so main's history stays clean.
        run: |
          mkdir -p state
          if git fetch -q --depth=1 origin state; then
            git show FETCH_HEAD:seen.json > state/seen.json
          fi
          cp state/seen.json "$RUNNER_TEMP/seen.before" 2>/dev/null || true
      - name: Check for new internships
        run: python -m jobscanner ${{ inputs.test && '--test' || '' }}
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TRACKER_URL: ${{ secrets.TRACKER_URL }}       # optional: application tracker (see README)
          TRACKER_TOKEN: ${{ secrets.TRACKER_TOKEN }}
      - name: Save seen postings
        if: always()      # a list that failed still lets the others' progress be kept
        run: |
          [ -f state/seen.json ] || exit 0
          cmp -s state/seen.json "$RUNNER_TEMP/seen.before" && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Replace the branch with one fresh commit: no history to pile up.
          blob=$(git hash-object -w state/seen.json)
          tree=$(printf '100644 blob %s\tseen.json\n' "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -m "Seen postings")
          git push -qf origin "$commit:refs/heads/state"
