name: Internship alerts

on:
  schedule:
    - cron: "23 * * * *"  # hourly; off the top of the hour, when GitHub often delays or skips runs
  workflow_dispatch:

permissions:
  contents: write         # to commit state/seen.json

concurrency:
  group: internship-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check for new internships
        run: python -m jobscanner
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
      - name: Save seen postings
        if: always()      # a list that failed still lets the others' progress be kept
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Update seen postings"
          git push
